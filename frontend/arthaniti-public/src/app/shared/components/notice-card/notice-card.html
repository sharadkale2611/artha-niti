<div class="notice-card border-bottom py-3">

  <div class="row align-items-center">

    <div class="col-auto">

      <div class="notice-date text-center">
        <div class="fw-bold">
          {{ date() }}
        </div>
      </div>

    </div>

    <div class="col">

      <h6 class="mb-1 fw-semibold">
        {{ title() }}
      </h6>

      @if (description()) {
        <p class="text-muted small mb-0">
          {{ description() }}
        </p>
      }

    </div>

    <div class="col-auto">

      <button
        type="button"
        class="btn btn-sm btn-outline-primary">

        View

      </button>

    </div>

  </div>

</div>
